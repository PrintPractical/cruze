# How `cruze review` starts an agent in a fresh context to run a role, with the
# prompt on standard input. This lets Claude Code read the project and run git
# and cruze. The verifier runs the system, so add the project's build and run
# commands, such as "Bash(cargo:*)". Without review.command, your agent runs each
# role in a helper of its own.
review:
  command: ["claude", "-p", "--allowedTools", "Read Grep Glob Bash(git diff:*) Bash(git log:*) Bash(git show:*) Bash(cruze:*)"]
