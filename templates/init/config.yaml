# Cruze project configuration, created by cruze {{cruze_version}}.
# The format is described in .agents/skills/cruze-formats/reference/config.md.
version: 1
project: {{project_name_quoted}}

# Where work items are tracked. V1 supports markdown in the repository only.
tracker: markdown

# Source files `cruze check` inspects, and files `cruze trace` searches for
# scenario IDs. Project-scope architecture design sets these.
source: []
tests: []

# Budgets enforced by `cruze check`. List a file under exceptions, with a
# reason, to allow it past a budget.
check:
  max_lines: 250
  max_types: 5
  exceptions: []

# Layer rules, written by project-scope architecture design from the module map.
layers: []
