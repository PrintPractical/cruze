# Cruze project configuration, created by cruze {{cruze_version}}.
# The format is described in .agents/skills/cruze-formats/config.md.
version: 2
# The Cruze whose skills this project installed. `cruze install` keeps it current.
cruze: "{{cruze_version}}"
project: {{project_name_quoted}}

# Source files `cruze check` inspects, and test files `cruze trace` searches
# for scenario IDs. The foundation feature sets these.
source: []
tests: []

# Budgets `cruze check` warns on: a backstop against a file that has outgrown
# one responsibility, not a size to design to. List a file under exceptions,
# with a reason, to allow it past a budget.
check:
  max_lines: 600
  max_types: 12
  exceptions: []

# Layer rules from docs/architecture.md: which layer may import which.
layers: []

{{review_setting}}
