name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The walking-skeleton change adds the language's format, lint, build and
      # test steps here, from `commands:` in .cruze/config.yaml.
      - name: Documents match the Cruze formats
        run: npx --yes {{cruze_package}} validate
      - name: Layer rules and file budgets
        run: npx --yes {{cruze_package}} check --ci
      - name: Every built scenario has a test
        run: npx --yes {{cruze_package}} trace --all
