name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The foundation feature adds the language's format, lint, build and
      # test steps here, with a coverage gate.
      - name: Documents match the Cruze formats
        run: npx --yes --package={{cruze_package}} cruze validate
      - name: Layer rules and file budgets
        run: npx --yes --package={{cruze_package}} cruze check --ci
      - name: Every built scenario has a test
        run: npx --yes --package={{cruze_package}} cruze trace
