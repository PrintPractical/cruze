name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck, test (including the skill lint) and build
        run: npm run check
      - name: Install the packed package into a fresh repository
        run: |
          tarball="$PWD/$(npm pack --silent | tail -1)"
          repo="$(mktemp -d)"
          git -C "$repo" init -q
          (cd "$repo" && npx --yes --package="$tarball" cruze init --name "CI Smoke" --yes)
          test -f "$repo/.claude/skills/cruze-about/SKILL.md"
          test -f "$repo/.cruze/config.yaml"
          # The steps the generated CI runs pass on a fresh repository.
          for step in validate "check --ci" "trace --all"; do
            (cd "$repo" && npx --yes --package="$tarball" cruze $step)
          done
