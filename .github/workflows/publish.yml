name: Publish

# Publishes to npm when a version tag is pushed, using npm trusted publishing
# (OIDC), so no npm token is stored in the repository. See RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Publish, unless this version is already on npm
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@printpractical/cruze@$version" version >/dev/null 2>&1; then
            echo "@printpractical/cruze@$version is already published; nothing to do."
          else
            npm publish --access public --provenance
          fi
