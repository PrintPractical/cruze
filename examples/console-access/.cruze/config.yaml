# Cruze project configuration, created by cruze 0.0.14.
# The format is described in .agents/skills/cruze-formats/config.md.
version: 2
cruze: "0.0.15"
project: "Console Access"

source: ["src/**/*.rs"]
tests: ["src/**/*.rs", "tests/**/*.rs"]

check:
  max_lines: 600
  max_types: 12
  exceptions:
    - path: src/cli/args.rs
      reason: the clap derive struct lists every command and flag in one place

# From the Layers section of docs/architecture.md.
layers:
  - name: domain
    paths: ["src/domain/**"]
    may_import: []
  - name: app
    paths: ["src/app/**"]
    may_import: [domain]
  - name: adapters
    paths: ["src/adapters/**"]
    may_import: [app, domain]
  - name: cli
    paths: ["src/cli/**"]
    may_import: [app, domain]
  - name: main
    paths: ["src/main.rs"]
    may_import: [cli, adapters, app, domain]
